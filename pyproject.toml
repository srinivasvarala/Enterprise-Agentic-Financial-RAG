[project]
name = "finrag"
version = "0.1.0"
description = "Enterprise RAG platform for financial document intelligence"
authors = [
    { name = "Srinivas Varala", email = "srinivas.varala@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.44.5",
    "docling>=2.150.1",
    "fastapi>=0.164.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "procrastinate[psycopg]>=3.11.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.9",
    "torch>=2.15.0",  # transitive via Docling; direct so the CPU index below applies
    "torchvision>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.5",
    "httpx>=0.28.1",
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.5",
]

# Linux (Docker image, CI) gets CPU-only torch: the default PyPI wheel drags in ~3 GB of CUDA
# libraries that Docling does not need here. macOS wheels from PyPI are already CPU/MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
extend-exclude = [".claude"]  # agent worktrees live inside the repo directory
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "ASYNC", "TID"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read config via finrag.core.config.Settings (CODING_STANDARDS.md)."
"os.getenv".msg = "Read config via finrag.core.config.Settings (CODING_STANDARDS.md)."
"langchain".msg = "Framework-free core: LangChain only inside finrag/guardrails (ADR-0002)."
"langchain_core".msg = "Framework-free core: LangChain only inside finrag/guardrails (ADR-0002)."
"llama_index".msg = "Framework-free core (ADR-0002)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"src/finrag/core/config.py" = ["TID251"]  # the one place that reads the environment
"src/finrag/guardrails/**" = ["TID251"]  # NeMo Guardrails pulls in LangChain (ADR-0004)

[tool.importlinter]
root_package = "finrag"

[[tool.importlinter.contracts]]
name = "core depends on no feature module (only the composition root wires adapters)"
type = "forbidden"
source_modules = ["finrag.core"]
forbidden_modules = [
    "finrag.api",
    "finrag.indexing",
    "finrag.ingestion",
    "finrag.jobs",
    "finrag.storage",
]
ignore_imports = ["finrag.core.container -> finrag.**"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not eval'"
markers = [
    "integration: needs docker compose services (make up)",
    "eval: runs real models against the golden set (costs money)",
]
