name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Real-Docling tests download ~505 MB of models from Hugging Face on first use. Key on the
      # lockfile (it pins the Docling version); fall back to an older cache and refresh it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-docling-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: hf-docling-${{ runner.os }}-
      - name: Start services
        run: docker compose up -d --wait postgres qdrant seaweedfs
      - run: uv run pytest -m integration
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
