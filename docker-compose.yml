# Local stack: infrastructure plus the ingestion path (migrate -> api + worker, one shared image).
# Embeddings: set FINRAG_VOYAGE_API_KEY (host env or .env), or run offline with
#   FINRAG_EMBEDDER_BACKEND=hash FINRAG_SPARSE_BACKEND=hash make up
name: finrag

x-app: &app
  build: .
  image: finrag-app:local
  environment: &app-env
    FINRAG_ENV: local
    FINRAG_DATABASE_URL: postgresql+psycopg://finrag:finrag@postgres:5432/finrag
    FINRAG_QDRANT_URL: http://qdrant:6333
    FINRAG_S3_ENDPOINT_URL: http://seaweedfs:8333
    FINRAG_OTEL_EXPORTER_ENDPOINT: http://phoenix:6006/v1/traces
    FINRAG_VOYAGE_API_KEY: ${FINRAG_VOYAGE_API_KEY:-}
    FINRAG_EMBEDDER_BACKEND: ${FINRAG_EMBEDDER_BACKEND:-voyage}
    FINRAG_SPARSE_BACKEND: ${FINRAG_SPARSE_BACKEND:-fastembed}
    FINRAG_ANTHROPIC_API_KEY: ${FINRAG_ANTHROPIC_API_KEY:-}
    FINRAG_GENERATOR_BACKEND: ${FINRAG_GENERATOR_BACKEND:-claude}
    FINRAG_RERANKER_BACKEND: ${FINRAG_RERANKER_BACKEND:-bge}
  depends_on: &app-deps
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    qdrant:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finrag
      POSTGRES_PASSWORD: finrag
      POSTGRES_DB: finrag
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrag -d finrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0 # server minor matches the pinned qdrant-client (1.20)
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck: # the image ships no curl; probe the REST port with bash
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible blob store (ADR-0007). MinIO no longer publishes community images.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    # The S3 API only starts after the master elects itself leader and the filer connects (~20s).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  phoenix:
    image: arizephoenix/phoenix:version-11.0.0
    ports:
      - "6006:6006" # UI + OTLP/HTTP (/v1/traces)
      - "4317:4317" # OTLP/gRPC
    volumes: [phoenix-data:/mnt/data]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data

  # One-shot: Alembic schema + Procrastinate schema (migration 0003) before api/worker start.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Docling needs ~1 GB per PDF and a full 10-K more: give the Docker VM at least 6 GB (README).
  worker:
    <<: *app
    command: ["python", "-m", "finrag.jobs.worker"]
    mem_limit: ${FINRAG_WORKER_MEM_LIMIT:-3g}

  # Eval index build (`make eval-index`, profile `eval`, never part of `make up`). Own Tenant,
  # Collection, Qdrant collection and blob bucket (finrag.evaluation.environment), so eval documents
  # never reach the default Tenant. Run it with `--no-deps`: the stack must already be up and
  # migrated, and its containers are not touched. The rendered PDFs come from `make eval-render`.
  eval-index:
    <<: *app
    build:
      context: .
      target: eval
    image: finrag-eval:dev
    profiles: [eval]
    environment:
      <<: *app-env
      FINRAG_DEFAULT_TENANT_ID: "00000000-0000-4000-8000-0000000000e1"
      FINRAG_DEFAULT_COLLECTION_ID: "00000000-0000-4000-8000-0000000000e2"
      FINRAG_QDRANT_COLLECTION: finrag_eval_chunks
      FINRAG_S3_BUCKET: finrag-eval-documents
      FINRAG_MAX_UPLOAD_BYTES: "268435456" # a rendered 10-K PDF can exceed the 50 MB default
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    volumes:
      - ./evals:/evals:ro
      - ./evals/results:/evals/results # writable: the build records the index fingerprint here
    command:
      [
        "python", "-m", "finrag.evaluation.index",
        "--manifest", "/evals/manifest.json", "--cache-dir", "/evals/cache",
      ]
    mem_limit: 6g
    restart: "no"

volumes:
  postgres-data:
  qdrant-data:
  seaweedfs-data:
  phoenix-data:
